name: Check

on:
  push:
    branches: [main, develop]
  pull_request:
  # On demand, from the Actions tab. The suite has two reasons to be re-run
  # without a new commit: an intermittent test (F29 permutes whole batches
  # under load and needs several runs to judge) and a job that has never run
  # green anywhere, which you want to retry after fixing the runner, not
  # after inventing a commit.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: cd supabase/functions && deno lint && deno check .
      - run: cd plugin && deno lint && deno check .

  # Database (pgTAP) and Edge Function (Deno.test) suites against a local
  # Supabase. Gates: every test green, Deno line coverage over the threshold
  # in _shared/testing/coverage_gate.ts.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Applies every migration and seed.sql on a fresh database. A broken
      # seed (F25) fails here, before it reaches anyone's laptop.
      #
      # `edge-runtime` is excluded on purpose, and it is the important name in
      # this list. The Deno suite calls each function's `handler()` in process
      # and stubs `globalThis.fetch`; the rows it inserts also fire the
      # triggers, which pg_net posts to `/functions/v1/…`. With an edge runtime
      # listening, that post is served — by a SECOND, out-of-process copy of
      # the same function, whose fetch nothing stubs. It takes the dispatch
      # lease first, so `handler()` finds nothing to claim and answers 200
      # without calling Meta, and the real request leaves for
      # graph.facebook.com with a fixture token. Which copy wins is a race:
      # this cost four tests on CI and five on a laptop, from one commit.
      # `whatsapp-dispatcher/index.test.ts` states the assumption in a comment
      # — "pg_net has no edge runtime to reach locally" — which was true
      # everywhere the suite had ever run, and false here.
      #
      # `inbucket` was renamed `mailpit`: the CLI printed "not valid to
      # exclude" and started it anyway.
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime
      - run: supabase db reset

      - name: pgTAP
        run: supabase/tests/run.sh

      - name: Deno.test + coverage gate
        run: cd supabase/functions && deno task test:coverage
        env:
          SUPABASE_URL: http://127.0.0.1:54321

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-functions
          path: supabase/functions/coverage/lcov.info
          if-no-files-found: ignore

      - if: always()
        run: supabase stop --no-backup

  # F25 pedía un job `promotion` acá: fallar cualquier pull request hacia
  # `main` que no viniera de `develop`, porque `main` es producción y los
  # cambios tenían que llegar promovidos desde una rama ya desplegada a DEV y
  # probada. Se quitó el 22/09, y no por estar de más sino porque **nada de
  # eso existe**: `develop` no está en el repo, no hay variables ni
  # environments configurados en ninguno de los dos —ni `SUPABASE_PROJECT_ID`
  # ni los `Production`/`Staging` que `release.yml` declara—, así que una rama
  # `develop` no desplegaría a ningún lado y no habría nada que promover.
  #
  # Mientras estuvo, no protegía: el flujo real es rama por ítem, merge local
  # y push, así que el job no se disparaba nunca (`skipped` en las tres
  # corridas del 21/09). Lo que sí hacía era **bloquear la protección de
  # rama**: al exigir PR para entrar a `main`, todo PR habría chocado contra
  # él, porque ninguno viene de una rama que no existe.
  #
  # Para traerlo de vuelta hace falta, en este orden: un proyecto de Supabase
  # para DEV, la rama `develop` apuntada a él, y recién entonces el gate.
