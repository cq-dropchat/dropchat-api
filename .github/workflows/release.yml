name: Release

on:
  # Using Supabase GitHub integration instead
  #push:
  #  branches:
  #    - main
  #    - develop
  workflow_dispatch:
    inputs:
      ui_sha:
        description: Full UI SHA with successful paired Check evidence
        required: true
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db-release:
    runs-on: ubuntu-24.04

    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact release and pairing
        run: node .github/scripts/verify-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN || github.token }}
          DEPLOYMENT_OWNER: ${{ vars.DEPLOYMENT_OWNER }}
          UI_REPOSITORY: ${{ vars.UI_REPOSITORY || 'cq-dropchat/dropchat-ui' }}
          UI_SHA: ${{ inputs.ui_sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/release/evidence.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Check required deployment configuration
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_ID SUPABASE_SESSION_POOLER_HOST; do
            if [[ -z "${!name}" ]]; then echo "Missing deployment configuration: $name"; exit 1; fi
          done
      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
      - run: supabase secrets set API_RELEASE="$GITHUB_SHA"
      - run: supabase functions deploy

      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: sh .github/workflows/deploy-vault-secrets.sh

      # Deploy Meta/WhatsApp configuration
      - run: |
          if [ -n "$META_SYSTEM_USER_ID" ]; then supabase secrets set META_SYSTEM_USER_ID="$META_SYSTEM_USER_ID"; fi
          if [ -n "$META_SYSTEM_USER_ACCESS_TOKEN" ]; then supabase secrets set META_SYSTEM_USER_ACCESS_TOKEN="$META_SYSTEM_USER_ACCESS_TOKEN"; fi
          if [ -n "$META_APP_ID" ]; then supabase secrets set META_APP_ID="$META_APP_ID"; fi
          if [ -n "$META_APP_SECRET" ]; then supabase secrets set META_APP_SECRET="$META_APP_SECRET"; fi
          if [ -n "$WHATSAPP_VERIFY_TOKEN" ]; then supabase secrets set WHATSAPP_VERIFY_TOKEN="$WHATSAPP_VERIFY_TOKEN"; fi
        env:
          META_SYSTEM_USER_ID: ${{ secrets.META_SYSTEM_USER_ID }}
          META_SYSTEM_USER_ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
